<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL Family Travel Guide 2026</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jost', sans-serif; background-color: #fdf8f0; }
        .cg { font-family: 'Cormorant+Garamond', serif; }
        .hero-gradient { background: linear-gradient(135deg, #1a3a2a 0%, #C8773A 100%); }
        .card-shadow { box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .active-tab { border-bottom: 3px solid #C8773A; color: #C8773A; font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const DATA = {
            weather: [
                { date: "Sun 31 May", label: "Day 1 Arrival", high: 31, low: 22, emoji: "☀️", tip: "Check-in and evening walk at Jalan Alor." },
                { date: "Mon 1 Jun", label: "Day 2 Public Holiday", high: 31, low: 23, emoji: "☁️", tip: "Public holiday! Arrive at Batu Caves before 9am." },
                { date: "Tue 2 Jun", label: "Day 3 KLCC Day", high: 32, low: 23, emoji: "☀️", tip: "Petronas Towers visit day. Don't be late for your slot." },
                { date: "Wed 3 Jun", label: "Day 4 Departure", high: 32, low: 22, emoji: "⛅", tip: "Morning shopping at Pavilion before transfer." }
            ],
            itinerary: [
                { day: "Day 1", slots: [
                    { time: "09:00", title: "Firefly FY3125 Departs", tag: "FLIGHT" },
                    { time: "14:30", title: "Berjaya Times Square Theme Park", tag: "KIDS FAVE" },
                    { time: "19:00", title: "Jalan Alor Food Street", tag: "DINNER" }
                ]},
                { day: "Day 2", slots: [
                    { time: "08:30", title: "Grab to Batu Caves", tag: "MUST DO" },
                    { time: "14:00", title: "SuperPark Malaysia", tag: "INDOOR" },
                    { time: "19:30", title: "Dinner near Bukit Bintang", tag: "RELAX" }
                ]}
            ],
            booking: [
                { name: "Petronas Twin Towers", price: "RM 98", link: "https://eticket.petronastwintowers.com.my", status: "URGENT" },
                { name: "Petrosains Discovery Centre", price: "RM 46", link: "https://eticket.petrosains.com.my", status: "KIDS" },
                { name: "KidZania KL", price: "Varies", link: "https://www.klook.com", status: "KLOOK" }
            ],
            wildcards: [
                { name: "Islamic Arts Museum", type: "Culture", tip: "Incredible architecture and world-class exhibits." },
                { name: "The River of Life", type: "Sightseeing", tip: "Best viewed at night when the blue lights and mist are active." }
            ]
        };

        function App() {
            const [tab, setTab] = useState('itinerary');
            const [activeDay, setActiveDay] = useState(0);

            return (
                <div className="max-w-md mx-auto bg-white min-vh-100 shadow-2xl">
                    <header className="hero-gradient p-8 text-white text-center">
                        <h1 className="cg text-4xl mb-2">KL Family Trip</h1>
                        <p className="text-sm opacity-90 tracking-widest uppercase">May 31 — June 03, 2026</p>
                    </header>

                    <nav className="flex justify-around border-b bg-white sticky top-0 z-10 text-sm">
                        {['itinerary', 'weather', 'booking', 'explore'].map(t => (
                            <button 
                                key={t} 
                                onClick={() => setTab(t)}
                                className={`py-4 px-2 capitalize ${tab === t ? 'active-tab' : 'text-gray-400'}`}
                            >
                                {t}
                            </button>
                        ))}
                    </nav>

                    <main className="p-6 bg-[#fdf8f0] min-h-screen">
                        {tab === 'itinerary' && (
                            <div>
                                <div className="flex gap-2 mb-6">
                                    {DATA.itinerary.map((d, i) => (
                                        <button 
                                            key={i} 
                                            onClick={() => setActiveDay(i)}
                                            className={`flex-1 py-2 rounded-lg text-xs font-bold transition ${activeDay === i ? 'bg-[#1a3a2a] text-white' : 'bg-white border'}`}
                                        >
                                            {d.day}
                                        </button>
                                    ))}
                                </div>
                                {DATA.itinerary[activeDay].slots.map((slot, i) => (
                                    <div key={i} className="bg-white p-4 rounded-xl mb-4 card-shadow border-l-4 border-[#C8773A]">
                                        <div className="flex justify-between items-center mb-1">
                                            <span className="text-[#C8773A] font-bold">{slot.time}</span>
                                            <span className="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-500 font-bold uppercase">{slot.tag}</span>
                                        </div>
                                        <h3 className="font-semibold text-gray-800">{slot.title}</h3>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'weather' && (
                            <div className="space-y-4">
                                {DATA.weather.map((w, i) => (
                                    <div key={i} className="bg-white p-4 rounded-xl card-shadow flex items-center justify-between">
                                        <div>
                                            <p className="text-xs text-gray-400 uppercase">{w.date}</p>
                                            <p className="font-bold text-gray-800">{w.label}</p>
                                            <p className="text-xs text-[#C8773A] mt-1 italic">{w.tip}</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-2xl">{w.emoji} {w.high}°C</div>
                                            <div className="text-xs text-gray-400">Low {w.low}°C</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'booking' && (
                            <div className="space-y-4">
                                {DATA.booking.map((b, i) => (
                                    <div key={i} className="bg-white p-5 rounded-xl card-shadow text-center">
                                        <div className="text-[10px] text-red-500 font-bold mb-1 tracking-tighter">{b.status}</div>
                                        <h3 className="cg text-xl mb-1">{b.name}</h3>
                                        <p className="text-gray-500 text-sm mb-4">Adult: {b.price}</p>
                                        <a href={b.link} target="_blank" className="bg-[#1a3a2a] text-white px-6 py-2 rounded-full text-xs font-bold inline-block">
                                            Book Now
                                        </a>
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 'explore' && (
                            <div className="space-y-4">
                                <h2 className="cg text-2xl text-[#1a3a2a]">Beyond the Guide</h2>
                                {DATA.wildcards.map((w, i) => (
                                    <div key={i} className="bg-white p-4 rounded-xl border border-dashed border-[#C8773A]">
                                        <span className="text-[10px] text-[#C8773A] font-bold uppercase">{w.type}</span>
                                        <h3 className="font-bold">{w.name}</h3>
                                        <p className="text-sm text-gray-600">{w.tip}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
